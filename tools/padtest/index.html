<!doctype html>
<html>
<head><meta charset="utf-8"><title>PadTest</title>
<style>body{background:#111;color:#0f0;font:14px/1.5 monospace;padding:1em;white-space:pre-wrap}</style>
</head>
<body>
<div id="out">waiting for gamepads...</div>
<script>
var last = "";
function beacon(d) {
  var img = new Image();
  img.src = "http://127.0.0.1:8130/r?d=" + encodeURIComponent(d) + "&n=" + Date.now();
}
// Resource-load and runtime errors (e.g. the injected shim failing to load).
window.addEventListener("error", function (e) {
  var t = e.target || {};
  beacon("ERR msg=" + (e.message || "") + " src=" + (t.src || "") +
         " tag=" + (t.tagName || ""));
}, true);
// Shim diagnostics: own-property patch on navigator + whether the tag is in the DOM.
(function () {
  var own = !!Object.getOwnPropertyDescriptor(navigator, "getGamepads");
  var tags = document.querySelectorAll('script[src="/__arcade_pad_shim.js"]').length;
  beacon("DIAG shim_own_prop=" + own + " shim_tag_count=" + tags);
})();
function snapshot() {
  var pads = navigator.getGamepads ? navigator.getGamepads() : [];
  var parts = [];
  for (var i = 0; i < pads.length; i++) {
    var p = pads[i];
    if (!p) continue;
    var pressed = [];
    for (var b = 0; b < p.buttons.length; b++) {
      if (p.buttons[b].pressed) pressed.push(b);
    }
    var axes = [];
    for (var a = 0; a < p.axes.length; a++) axes.push(p.axes[a].toFixed(2));
    parts.push(p.index + ":" + p.id + "|m=" + p.mapping +
               "|b=" + pressed.join(",") + "|a=" + axes.join(","));
  }
  return parts.join(" ; ") || "(no gamepads)";
}
setInterval(function () {
  var s = snapshot();
  if (s !== last) {
    last = s;
    document.getElementById("out").textContent =
      new Date().toLocaleTimeString() + "\n" + s;
    beacon(s);
  }
}, 100);
</script>
</body>
</html>
