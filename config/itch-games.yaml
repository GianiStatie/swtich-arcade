# itch.io collection sync config for the arcade watcher
#
# The watcher (scripts/itch-watcher.py on the Switch) polls one itch.io
# collection every `poll_seconds` (plus jitter) and mirrors it onto the
# cabinet. It backs off on HTTP 429 instead of retrying in a tight loop:
#   * game added to the collection      -> installed on the next idle poll
#   * game's web build re-uploaded      -> re-downloaded (md5 changed)
#   * game removed from the collection  -> uninstalled (prune: true)
# Changes are applied only while no game is running (Chromium closed);
# EmulationStation is restarted afterwards so the menu refreshes.
#
# collection: the numeric id of the itch.io collection. Find it in the
# collection URL: https://itch.io/c/8014540/limittestarcade -> 8014540
# (readable via https://api.itch.io/profile/collections with the API key).

collection: 8014540      # LimitTestArcade
prune: true
poll_seconds: 300
restart_es: true

# Optional per-game overrides, matched by itch game id:
#
# games:
#   - itch: 1829893       # PolyTrack (from the collection URL or API)
#     name: "PolyTrack"   # folder/display name (default: itch title)
#     upload: "PolyTrack-itch-v0.6.3.zip"  # pin a specific web.zip
#   - itch: 4877158
#     exclude: true        # never install this game
#
# Games that can't be auto-pulled (not free, not owned) log a warning and are
# skipped; give them a direct zip URL via a `zip:` entry handled by
# sync-itch-games.sh instead.

games: []